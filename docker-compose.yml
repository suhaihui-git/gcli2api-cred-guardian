services:
  cred-guardian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cred-guardian
    restart: unless-stopped
    ports:
      - "18933:18933"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18933/login', timeout=5)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
